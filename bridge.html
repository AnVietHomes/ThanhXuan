<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bridge Processing...</title>
</head>
<body style="background: #000; margin: 0;">
    <script>
        // 1. Lấy mã căn từ tham số trên URL (VD: ?unit=LA01-01)
        const urlParams = new URLSearchParams(window.location.search);
        const unitId = urlParams.get('unit');

        if (unitId) {
            // 2. Gửi tín hiệu mở bảng thông tin ra trang web cha (index.html)
            window.parent.postMessage({ type: "OPEN_UNIT", unitId: unitId }, "*");
        }

        // 3. Ngay lập tức đưa iframe quay trở lại tour Panoee gốc để không làm gián đoạn trải nghiệm 360
        // (Nhớ thay link iframe Panoee của bạn vào bên dưới)
        window.location.replace("https://tour.panoee.net/iframe/6ac5cdafbbd7eb16f960f542");
    </script>
</body>
</html>
