<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Real Estate Viewer - An Viet Homes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: -8px 0 32px 0 rgba(31, 38, 135, 0.2);
        }
        .transition-transform {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-900 overflow-hidden font-sans text-gray-100">

    <div class="relative w-full h-screen flex">
        
        <!-- Iframe Panoee -->
        <div id="viewer-container" class="w-full h-full transition-transform transform translate-x-0 relative z-0 bg-black">
            <!-- Đã đổi link thành iframe -->
            <iframe id="pano-iframe" src="https://tour.panoee.net/iframe/6ac5cdafbbd7eb16f960f542" 
                    frameborder="0" width="100%" height="100%" allowfullscreen></iframe>
        </div>

        <!-- Glassmorphism Panel -->
        <div id="info-panel" class="glass-panel absolute top-0 right-0 w-[420px] h-full p-6 flex flex-col transform translate-x-full transition-transform z-10">
            
            <img id="sold-stamp" src="images/sold.png" class="hidden absolute top-4 -left-10 w-32 h-32 z-20 drop-shadow-lg transform -rotate-12 pointer-events-none" alt="Đã bán">

            <button onclick="closePanel()" class="absolute top-4 right-4 text-white hover:text-gray-300 transition-colors z-30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <h2 id="unit-title" class="text-3xl font-bold mb-1 mt-6 text-white uppercase tracking-wider drop-shadow-md"></h2>
            <div id="unit-zone" class="text-sm uppercase tracking-widest text-emerald-400 font-bold mb-6"></div>

            <div id="unit-details" class="flex-1 overflow-y-auto no-scrollbar space-y-4 relative pr-2">
                <!-- Data đổ tự động vào đây -->
            </div>
            
            <div class="mt-6 pt-4 border-t border-white/20">
                <button class="w-full py-3 bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold rounded-lg border border-emerald-400/50 transition-all shadow-[0_4px_15px_rgba(16,185,129,0.3)]">
                    NHẬN BÁO GIÁ
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        let unitData = [];
        let lastHash = ""; // Lưu lại hash cũ để kiểm tra thay đổi

        // ĐỌC CSV
        function parseCSVRow(str) {
            const result = [];
            let curVal = '';
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === '"') {
                    inQuotes = !inQuotes;
                } else if (str[i] === ',' && !inQuotes) {
                    result.push(curVal.trim());
                    curVal = '';
                } else {
                    curVal += str[i];
                }
            }
            result.push(curVal.trim());
            return result;
        }

        async function loadData() {
            try {
                const response = await fetch('data.csv'); 
                let csvText = await response.text();
                
                csvText = csvText.replace(/\r/g, '');
                const lines = csvText.split('\n');
                
                if (lines.length < 2) return;
                const headers = parseCSVRow(lines[0]);
                
                unitData = [];
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const currentline = parseCSVRow(lines[i]);
                    const obj = {};
                    for (let j = 0; j < headers.length; j++) {
                        obj[headers[j]] = currentline[j] || "";
                    }
                    unitData.push(obj);
                }
                console.log("✅ Tải Data CSV thành công");
            } catch (error) {
                console.error("❌ Lỗi tải CSV:", error);
            }
        }

        // MỞ BẢNG
        function openPanel(unitId) {
            const data = unitData.find(item => item["Mã căn"] === unitId || item.id === unitId);
            if (!data) {
                console.warn("⚠️ Không tìm thấy data cho mã căn:", unitId);
                return;
            }

            document.getElementById('viewer-container').style.transform = "translateX(-200px)"; 
            document.getElementById('info-panel').classList.remove('translate-x-full');

            const soldStamp = document.getElementById('sold-stamp');
            if (data["Trạng thái"] && data["Trạng thái"].toString().toLowerCase().includes("đã bán")) {
                soldStamp.classList.remove('hidden');
            } else {
                soldStamp.classList.add('hidden');
            }

            document.getElementById('unit-title').innerText = data["Mã căn"] || data.id || "Đang cập nhật";
            document.getElementById('unit-zone').innerText = data["Phân khu"] || data.zone || "";

            const detailsContainer = document.getElementById('unit-details');
            let htmlContent = '';

            const excludedKeys = ['STT', 'Mã căn', 'id', 'Phân khu', 'zone', 'Trạng thái', 'images'];
            for (const [key, value] of Object.entries(data)) {
                if (excludedKeys.includes(key)) continue;
                if (value === null || value === undefined || value.toString().trim() === "") continue;

                htmlContent += `
                    <div class="flex justify-between items-center py-2 border-b border-white/10">
                        <span class="text-white/60 text-sm">${key}</span>
                        <span class="font-semibold text-white text-right max-w-[65%] break-words">${value}</span>
                    </div>
                `;
            }

            let imagesHtml = '';
            if (data["Mẫu nhà"] && data["Mẫu nhà"].toString().trim() !== "") {
                const mauNhaCode = data["Mẫu nhà"].toString().trim();
                imagesHtml += `<img src="images/thietkecan/${mauNhaCode}.png" class="w-full rounded-xl mb-4 shadow-lg border border-white/10 hover:scale-[1.02] transition-transform bg-white/5" alt="Mặt bằng ${mauNhaCode}" onerror="this.style.display='none'">`;
            }
            if (data.images && data.images.trim() !== "") {
                let imageArray = typeof data.images === 'string' ? data.images.split(',') : data.images;
                imageArray.forEach(img => {
                    const imgName = img.trim();
                    if (imgName) {
                        imagesHtml += `<img src="images/${imgName}" class="w-full rounded-xl mb-4 shadow-lg border border-white/10 hover:scale-[1.02] transition-transform" alt="Phối cảnh" onerror="this.style.display='none'">`;
                    }
                });
            }

            if (imagesHtml !== '') {
                htmlContent += `<div class="mt-8"><h3 class="text-white/50 font-bold mb-4 uppercase text-xs tracking-widest">Mặt bằng & Phối cảnh</h3>` + imagesHtml + `</div>`;
            }

            detailsContainer.innerHTML = htmlContent;
        }

        // ĐÓNG BẢNG
        function closePanel() {
            document.getElementById('viewer-container').style.transform = "translateX(0)";
            document.getElementById('info-panel').classList.add('translate-x-full');
            // Reset hash để có thể click lại chính căn đó
            window.location.hash = "";
        }

        // PHƯƠNG ÁN C: BẮT SỰ KIỆN HASH URL
        // Panoee (nằm trong iframe) không thay đổi url trình duyệt chính, nhưng nó phát tín hiệu ra ngoài khi URL của nó đổi
        window.addEventListener("message", (event) => {
            try {
                // Kiểm tra xem Panoee có gửi sự kiện thay đổi hash/scene không
                if (typeof event.data === 'string' && event.data.includes('panoee')) {
                     // Một số tour Panoee cũ đẩy data dạng string
                } else if (event.data && event.data.type === 'PANOEE_EVENT') {
                    // Xử lý sự kiện nếu có
                }
            } catch(e) {}
        });

        // BẮT SỰ KIỆN QUA POSTMESSAGE (CẬP NHẬT TỪ PANOEE IFRAME EVENT)
        // Khi Panoee gắn Link dạng URL (ví dụ #LA01-01), nó có thể bắn ra window message
        window.addEventListener("message", (event) => {
            try {
                // Nhiều nền tảng 360 truyền qua payload có chứa thuộc tính hash hoặc url
                const msg = event.data;
                const msgStr = JSON.stringify(msg);

                // Thử tìm mã căn trong chuỗi message
                if(unitData.length > 0) {
                     for (let i = 0; i < unitData.length; i++) {
                        const unitId = unitData[i]["Mã căn"] || unitData[i]["id"];
                        // Quét xem trong data Panoee gửi ra có chứa đoạn "#LA01-01" không
                        if (unitId && msgStr.includes("#" + unitId)) {
                            console.log("🎯 Bắt được mã qua Hash Message:", unitId);
                            openPanel(unitId);
                            break; 
                        }
                    }
                }
            } catch (err) {}
        });
        
        // Khởi động
        loadData();
    </script>
</body>
</html>
