<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Real Estate Viewer - An Viet Homes</title>
    
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Photo Sphere Viewer & Markers -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css"/>
    
    <script src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    colors: {
                        avh: {
                            dark: '#164f3b',
                            light: '#47a07d',
                            pink: '#eaa2cd'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Manrope', sans-serif; overflow: hidden; }
        
        /* Ẩn triệt để thông báo lỗi và icon loading xấu xí mặc định của Photo Sphere Viewer */
        .psv-notification, .psv-loader-container { display: none !important; }
        
        /* Hiệu ứng Liquid Glass chuẩn Apple */
        .glass-3d {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(22, 79, 59, 0.25) 100%);
            backdrop-filter: blur(40px) saturate(210%) brightness(110%);
            -webkit-backdrop-filter: blur(40px) saturate(210%) brightness(110%);
            border-radius: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.65);
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.45),
                inset 0 0 24px rgba(255, 255, 255, 0.08),
                0 24px 48px -12px rgba(0, 0, 0, 0.45);
        }

        .transition-panel { transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Nút menu Camera phong cách viên thuốc Liquid Glass */
        .scene-btn {
            background: rgba(22, 79, 59, 0.4); 
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.3); 
            color: white;
            padding: 10px 24px; 
            border-radius: 999px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            font-weight: 600; 
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .scene-btn:hover { background: rgba(71, 160, 125, 0.6); }
        .scene-btn.active { 
            background: #47a07d; 
            border-color: #ffffff; 
            color: white;
            box-shadow: 0 0 20px rgba(71, 160, 125, 0.8); 
        }

        /* Đồng bộ Liquid Glass cho Label tên căn lơ lửng */
        .unit-marker-label {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: #164f3b;
            padding: 6px 18px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.02em;
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.8),
                0 8px 20px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transform: translateY(-20px);
        }

        /* Loading Spinner Tùy chỉnh */
        .spinner {
            width: 80px; height: 80px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">

    <div class="relative w-full h-screen flex">
        
        <!-- Không gian 360 -->
        <div id="viewer" class="w-full h-full relative z-0 bg-avh-dark"></div>

        <!-- Màn hình Loading Thiết kế riêng -->
        <div id="loading-overlay" class="absolute inset-0 bg-avh-dark/90 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden">
            <div class="relative flex items-center justify-center">
                <div class="spinner absolute"></div>
                <span class="text-white font-bold text-xs tracking-widest uppercase relative z-10">Loading</span>
            </div>
            <p class="text-white/70 mt-12 text-sm">Đang tải dữ liệu căn và mặt bằng. Vui lòng chờ trong giây lát.</p>
        </div>

        <!-- Màn hình Báo Lỗi Tùy chỉnh -->
        <div id="error-overlay" class="absolute inset-0 bg-avh-dark/90 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden">
            <div class="w-20 h-20 rounded-full border-4 border-white/30 flex items-center justify-center mb-6">
                <span class="text-white text-4xl font-bold">!</span>
            </div>
            <h2 class="text-white text-lg mb-2">Dữ liệu góc camera này đang được cập nhật.</h2>
            <p class="text-white/70 mb-8">Vui lòng quay lại vào thời điểm khác</p>
            <button onclick="switchScene('tongthe1')" class="bg-avh-pink text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(234,162,205,0.4)] hover:bg-pink-400 transition-colors">
                Quay lại góc Tổng thể 1
            </button>
        </div>

        <!-- Lớp Gradient dưới cùng & Logo -->
        <div class="absolute bottom-0 w-full h-40 bg-gradient-to-t from-avh-dark/90 to-transparent z-10 pointer-events-none"></div>
        <img src="images/logo.png" class="absolute bottom-8 left-8 z-20 h-16 object-contain pointer-events-none drop-shadow-lg" alt="An Viet Homes" onerror="this.style.display='none'">

        <!-- Menu Camera -->
        <div id="scene-menu" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex space-x-4 z-20"></div>

        <!-- BẢNG THÔNG TIN LIQUID GLASS (Phải) -->
        <div id="info-panel" class="glass-3d absolute top-6 right-6 w-[450px] h-[calc(100vh-48px)] p-8 flex flex-col transform translate-x-[120%] opacity-0 transition-panel z-30 overflow-hidden">
            
            <button onclick="closePanel()" class="absolute top-6 right-6 text-white/70 hover:text-white z-50 bg-black/20 rounded-full p-2 backdrop-blur-md transition-colors border border-white/20 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>

            <!-- Tiêu đề -->
            <div class="mb-6">
                <div class="flex items-end gap-3">
                    <span class="text-white/80 text-sm font-medium">Mã căn:</span>
                    <h2 id="unit-title" class="text-4xl font-extrabold text-avh-light uppercase tracking-wide drop-shadow-md leading-none"></h2>
                </div>
                <div class="mt-2 text-sm text-white/90">Phân khu: <span id="unit-zone" class="font-semibold text-white"></span></div>
            </div>

            <!-- Nội dung cuộn -->
            <div id="unit-details" class="flex-1 overflow-y-auto no-scrollbar relative pr-2 z-10 pb-20"></div>
            
            <!-- Lớp Gradient mờ chân bảng -->
            <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-avh-dark/90 to-transparent pointer-events-none z-10 rounded-b-[28px]"></div>

            <!-- Nút hành động -->
            <div class="absolute bottom-8 left-8 right-8 z-20">
                <button class="w-full py-4 bg-avh-light hover:bg-[#3b8c6a] text-white font-bold rounded-xl transition-all shadow-[0_5px_20px_rgba(71,160,125,0.5)] text-sm uppercase tracking-wider border border-[#47a07d]/50">
                    NHẬN BÁO GIÁ
                </button>
            </div>
        </div>
    </div>

    <script>
        let unitData = [];
        let psv, markersPlugin;
        let selectedUnitId = null;
        
        // Tất cả đường dẫn đã được đồng bộ chuẩn với thư mục "images"
        const scenesConfig = [
            { id: "tongthe1", name: "Tổng thể 1", image: "images/tongthe1.jpg", polyCol: "poly_tongthe1" },
            { id: "tongthe2", name: "Tổng thể 2", image: "images/tongthe2.jpg", polyCol: "poly_tongthe2" },
            { id: "tongthe3", name: "Tổng thể 3", image: "images/tongthe3.jpg", polyCol: "poly_tongthe3" },
            { id: "tongthe4", name: "Tổng thể 4", image: "images/tongthe4.jpg", polyCol: "poly_tongthe4" }
        ];
        
        let currentSceneId = scenesConfig[0].id;

        function showLoader() { document.getElementById('loading-overlay').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('loading-overlay').classList.add('hidden'); }
        function showError() { document.getElementById('error-overlay').classList.remove('hidden'); }
        function hideError() { document.getElementById('error-overlay').classList.add('hidden'); }

        // Bộ đọc CSV
        function parseCSVRow(str) {
            const result = []; let curVal = ''; let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === '"') {
                    if (inQuotes && str[i+1] === '"') { curVal += '"'; i++; } else { inQuotes = !inQuotes; }
                } else if (str[i] === ',' && !inQuotes) { result.push(curVal.trim()); curVal = ''; } 
                else { curVal += str[i]; }
            }
            result.push(curVal.trim()); return result;
        }

        async function loadDataAndInitViewer() {
            try {
                const response = await fetch('data.csv'); 
                if(!response.ok) throw new Error("Không tìm thấy CSV");
                let csvText = await response.text();
                csvText = csvText.replace(/\r/g, '');
                const lines = csvText.split('\n');
                
                if (lines.length >= 2) {
                    const headers = parseCSVRow(lines[0]);
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const currentline = parseCSVRow(lines[i]);
                        const obj = {};
                        for (let j = 0; j < headers.length; j++) obj[headers[j]] = currentline[j] || "";
                        unitData.push(obj);
                    }
                }
            } catch (error) { console.error("Lỗi tải data.csv:", error); }

            initViewer();
            renderSceneMenu();
        }

        function initViewer() {
            const firstScene = scenesConfig[0];
            
            psv = new PhotoSphereViewer.Viewer({
                container: document.querySelector('#viewer'),
                panorama: firstScene.image,
                autorotateSpeed: '0',
                defaultZoomLvl: 10,
                navbar: false,
                plugins: [ PhotoSphereViewer.MarkersPlugin ]
            });

            markersPlugin = psv.getPlugin(PhotoSphereViewer.MarkersPlugin);

            // Xử lý vẽ Poly khi tải xong
            psv.addEventListener('ready', () => drawPolygonsForCurrentScene());
            
            // Lắng nghe lỗi nạp ảnh để bật màn hình Báo Lỗi xịn xò
            psv.addEventListener('error', (e) => {
                showError();
            });
            
            // Xử lý sự kiện click vào Polygon
            markersPlugin.addEventListener('select-marker', ({ marker }) => {
                if(marker.id && !marker.id.includes('_label')) {
                    openPanel(marker.id, marker);
                }
            });
        }

        function switchScene(sceneId) {
            hideError();
            const targetScene = scenesConfig.find(s => s.id === sceneId);
            if(!targetScene) return;

            currentSceneId = sceneId;
            selectedUnitId = null;
            markersPlugin.clearMarkers();
            closePanel();

            document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${sceneId}`).classList.add('active');

            showLoader();

            psv.setPanorama(targetScene.image, { showLoader: false, transition: 800 })
            .then(() => {
                hideLoader();
                drawPolygonsForCurrentScene();
            })
            .catch(() => {
                // Nếu góc cam chưa có ảnh -> bắt lỗi và hiển thị màn hình thông báo
                hideLoader();
                showError();
            });
        }

        function drawPolygonsForCurrentScene() {
            const currentScene = scenesConfig.find(s => s.id === currentSceneId);
            const activeColumn = currentScene.polyCol; 

            unitData.forEach(item => {
                const unitId = item["Mã căn"] || item.id;
                const rawData = item[activeColumn];

                if (unitId && rawData && rawData.trim() !== "") {
                    try {
                        const parsedData = JSON.parse(rawData);
                        const polygonArray = parsedData.map(p => [p.yaw, p.pitch]);

                        const isSold = item["Trạng thái"] && item["Trạng thái"].toString().toLowerCase().includes("đã bán");
                        const fillColor = isSold ? 'rgba(234, 162, 205, 0.4)' : 'rgba(71, 160, 125, 0.3)';
                        const strokeColor = isSold ? '#eaa2cd' : '#47a07d';

                        markersPlugin.addMarker({
                            id: unitId,
                            polygon: polygonArray,
                            tooltip: { content: `Nhấp để xem ${unitId}`, position: 'top center' },
                            svgStyle: { fill: fillColor, stroke: strokeColor, strokeWidth: '2px', cursor: 'pointer' },
                            data: { points: polygonArray, isSold: isSold } 
                        });
                    } catch (e) {}
                }
            });
        }

        function renderSceneMenu() {
            const menuContainer = document.getElementById('scene-menu');
            scenesConfig.forEach(scene => {
                const btn = document.createElement('button');
                btn.id = `btn-${scene.id}`;
                btn.className = `scene-btn ${scene.id === currentSceneId ? 'active' : ''}`;
                btn.innerText = scene.name;
                btn.onclick = () => switchScene(scene.id);
                menuContainer.appendChild(btn);
            });
        }

        function openPanel(unitId, markerObj) {
            const data = unitData.find(item => item["Mã căn"] === unitId || item.id === unitId);
            if (!data) return;

            // Phục hồi màu Polygon cũ
            if (selectedUnitId && selectedUnitId !== unitId) {
                const oldMarker = markersPlugin.getMarker(selectedUnitId);
                if (oldMarker) {
                    const oldSold = oldMarker.data.isSold;
                    markersPlugin.updateMarker({
                        id: selectedUnitId,
                        svgStyle: { 
                            fill: oldSold ? 'rgba(234, 162, 205, 0.4)' : 'rgba(71, 160, 125, 0.3)', 
                            stroke: oldSold ? '#eaa2cd' : '#47a07d', strokeWidth: '2px' 
                        }
                    });
                    markersPlugin.removeMarker(`${selectedUnitId}_label`);
                }
            }

            selectedUnitId = unitId;

            // Nổi bật Polygon đang chọn (Màu trắng mờ)
            markersPlugin.updateMarker({
                id: unitId,
                svgStyle: { fill: 'rgba(255, 255, 255, 0.45)', stroke: '#ffffff', strokeWidth: '3px' }
            });

            // Tính toán Tâm Polygon để gắn Label và Xoay Camera
            const points = markerObj.data.points;
            let sumY = 0, sumP = 0;
            points.forEach(p => { sumY += p[0]; sumP += p[1]; });
            const centerYaw = sumY / points.length;
            const centerPitch = sumP / points.length;

            markersPlugin.addMarker({
                id: `${unitId}_label`,
                position: { yaw: centerYaw, pitch: centerPitch },
                html: `<div class="unit-marker-label">${unitId}</div>`,
                anchor: 'bottom center'
            });

            // Xoay Camera (Lệch tâm về bên trái chừa chỗ cho bảng thông tin)
            psv.animate({
                yaw: centerYaw + 0.35, 
                pitch: centerPitch,
                zoom: 40,
                speed: 1000
            });

            // Hiển thị Giao diện Thông tin
            const infoPanel = document.getElementById('info-panel');
            infoPanel.classList.remove('translate-x-[120%]', 'opacity-0');
            infoPanel.classList.add('translate-x-0', 'opacity-100');

            document.getElementById('unit-title').innerText = data["Mã căn"] || data.id || "";
            document.getElementById('unit-zone').innerText = data["Phân khu"] || data.zone || "N/A";

            const detailsContainer = document.getElementById('unit-details');
            let htmlContent = '';
            
            for (const [key, value] of Object.entries(data)) {
                if (['STT', 'Mã căn', 'id', 'Phân khu', 'zone', 'Trạng thái', 'images'].includes(key) || key.startsWith('poly_')) continue;
                if (value === null || value === undefined || value.toString().trim() === "") continue;
                
                htmlContent += `
                    <div class="flex justify-between py-3 border-b border-white/10 items-center">
                        <span class="text-white/70 text-sm font-medium tracking-wide">${key}</span>
                        <span class="font-bold text-white text-right text-[15px]">${value}</span>
                    </div>`;
            }

            // Hình ảnh Diễn họa
            let imgDienHoa = '';
            if (data.images) {
                let imgArr = typeof data.images === 'string' ? data.images.split(',') : data.images;
                imgArr.forEach(img => { 
                    if (img.trim()) imgDienHoa += `<img src="images/${img.trim()}" class="w-full h-24 object-cover rounded-[14px] border border-white/20 shadow-lg">`; 
                });
            }

            // Hình ảnh Mặt bằng
            let imgMatBang = '';
            if (data["Mẫu nhà"]) {
                const mauNha = data["Mẫu nhà"].toString().trim();
                imgMatBang += `<img src="images/thietkecan/${mauNha}.png" class="w-full h-24 object-cover rounded-[14px] border border-white/20 shadow-lg bg-white/10">`;
            }
            
            if (imgDienHoa !== '') {
                htmlContent += `
                <div class="mt-8">
                    <h3 class="text-white/80 font-bold mb-3 text-[11px] tracking-widest uppercase opacity-80">Hình ảnh diễn họa:</h3>
                    <div class="grid grid-cols-2 gap-3">${imgDienHoa}</div>
                </div>`;
            }

            if (imgMatBang !== '') {
                htmlContent += `
                <div class="mt-6">
                    <h3 class="text-white/80 font-bold mb-3 text-[11px] tracking-widest uppercase opacity-80">Mặt bằng căn:</h3>
                    <div class="grid grid-cols-3 gap-2">${imgMatBang}</div>
                </div>`;
            }
            
            detailsContainer.innerHTML = htmlContent;
        }

        function closePanel() {
            const infoPanel = document.getElementById('info-panel');
            infoPanel.classList.remove('translate-x-0', 'opacity-100');
            infoPanel.classList.add('translate-x-[120%]', 'opacity-0');

            if (selectedUnitId) {
                const oldMarker = markersPlugin.getMarker(selectedUnitId);
                if (oldMarker) {
                    const oldSold = oldMarker.data.isSold;
                    markersPlugin.updateMarker({
                        id: selectedUnitId,
                        svgStyle: { 
                            fill: oldSold ? 'rgba(234, 162, 205, 0.4)' : 'rgba(71, 160, 125, 0.3)', 
                            stroke: oldSold ? '#eaa2cd' : '#47a07d', strokeWidth: '2px' 
                        }
                    });
                    markersPlugin.removeMarker(`${selectedUnitId}_label`);
                }
                selectedUnitId = null;
            }
        }

        loadDataAndInitViewer();
    </script>
</body>
</html>
