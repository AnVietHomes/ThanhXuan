<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Real Estate Viewer - An Viet Homes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Photo Sphere Viewer & Markers -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css"/>
    
    <script src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.js"></script>

    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: -8px 0 32px 0 rgba(31, 38, 135, 0.2);
        }
        .transition-transform { transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Giao diện nút chuyển góc cam */
        .scene-btn {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2); color: white;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s;
            font-weight: 500; font-size: 14px;
        }
        .scene-btn:hover { background: rgba(16, 185, 129, 0.5); }
        .scene-btn.active { background: rgba(16, 185, 129, 0.9); border-color: #34d399; font-weight: bold; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body class="bg-gray-900 overflow-hidden font-sans text-gray-100">

    <div class="relative w-full h-screen flex">
        
        <!-- Khung hiển thị 360 -->
        <div id="viewer" class="w-full h-full transition-transform transform translate-x-0 relative z-0 bg-black"></div>

        <!-- Hướng dẫn góc trái -->
        <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-4 py-2 rounded-lg text-xs z-20 text-emerald-300 pointer-events-none shadow-md border border-white/10">
            🏢 An Việt Homes | Click vào vùng sáng căn hộ để xem chi tiết
        </div>

        <!-- Menu chuyển góc Camera (Dưới cùng) -->
        <div id="scene-menu" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex space-x-3 z-20"></div>

        <!-- Bảng thông tin Glassmorphism (Trượt từ phải ra) -->
        <div id="info-panel" class="glass-panel absolute top-0 right-0 w-[420px] h-full p-6 flex flex-col transform translate-x-full transition-transform z-30">
            
            <img id="sold-stamp" src="images/sold.png" class="hidden absolute top-4 -left-10 w-32 h-32 z-40 drop-shadow-lg transform -rotate-12 pointer-events-none" alt="Đã bán">

            <button onclick="closePanel()" class="absolute top-4 right-4 text-white hover:text-gray-300 z-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>

            <h2 id="unit-title" class="text-3xl font-bold mb-1 mt-6 text-white uppercase tracking-wider drop-shadow-md"></h2>
            <div id="unit-zone" class="text-sm uppercase tracking-widest text-emerald-400 font-bold mb-6"></div>

            <div id="unit-details" class="flex-1 overflow-y-auto no-scrollbar space-y-4 relative pr-2"></div>
            
            <div class="mt-6 pt-4 border-t border-white/20">
                <button class="w-full py-3 bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold rounded-lg transition-all shadow-[0_4px_15px_rgba(16,185,129,0.3)] border border-emerald-400/50">
                    NHẬN BÁO GIÁ
                </button>
            </div>
        </div>
    </div>

    <script>
        let unitData = [];
        let psv, markersPlugin;
        
        // CẤU HÌNH GÓC CAMERA & TÊN CỘT TRONG EXCEL
        const scenesConfig = [
            { id: "tongthe1", name: "🛸 Tổng thể 1", image: "images/tongthe1.jpg", polyCol: "poly_tongthe1" },
            { id: "tongthe2", name: "🛸 Tổng thể 2", image: "images/tongthe2.jpg", polyCol: "poly_tongthe2" },
            { id: "tongthe3", name: "🛸 Tổng thể 3", image: "images/tongthe3.jpg", polyCol: "poly_tongthe3" },
            { id: "tongthe4", name: "🛸 Tổng thể 4", image: "images/tongthe4.jpg", polyCol: "poly_tongthe4" }
        ];
        
        let currentSceneId = scenesConfig[0].id;

        function parseCSVRow(str) {
            const result = []; let curVal = ''; let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === '"') inQuotes = !inQuotes;
                else if (str[i] === ',' && !inQuotes) { result.push(curVal.trim()); curVal = ''; } 
                else curVal += str[i];
            }
            result.push(curVal.trim()); return result;
        }

        async function loadDataAndInitViewer() {
            try {
                const response = await fetch('data.csv'); 
                let csvText = await response.text();
                csvText = csvText.replace(/\r/g, '');
                const lines = csvText.split('\n');
                
                if (lines.length >= 2) {
                    const headers = parseCSVRow(lines[0]);
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const currentline = parseCSVRow(lines[i]);
                        const obj = {};
                        for (let j = 0; j < headers.length; j++) obj[headers[j]] = currentline[j] || "";
                        unitData.push(obj);
                    }
                }
            } catch (error) { console.error("Lỗi tải data.csv:", error); }

            initViewer();
            renderSceneMenu();
        }

        function initViewer() {
            const firstScene = scenesConfig[0];
            psv = new PhotoSphereViewer.Viewer({
                container: document.querySelector('#viewer'),
                panorama: firstScene.image,
                autorotateSpeed: '0',
                defaultZoomLvl: 10,
                plugins: [ PhotoSphereViewer.MarkersPlugin ]
            });

            markersPlugin = psv.getPlugin(PhotoSphereViewer.MarkersPlugin);

            psv.addEventListener('ready', () => drawPolygonsForCurrentScene());
            
            // Lắng nghe sự kiện khách hàng click vào Polygon
            markersPlugin.addEventListener('select-marker', ({ marker }) => {
                if(marker.id) openPanel(marker.id);
            });
        }

        function switchScene(sceneId) {
            const targetScene = scenesConfig.find(s => s.id === sceneId);
            if(!targetScene) return;

            currentSceneId = sceneId;
            markersPlugin.clearMarkers();
            closePanel();

            document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${sceneId}`).classList.add('active');

            // Chuyển ảnh 360 với hiệu ứng mờ 1 giây
            psv.setPanorama(targetScene.image, { showLoader: true, transition: 1000 }).then(() => {
                drawPolygonsForCurrentScene();
            });
        }

        function drawPolygonsForCurrentScene() {
            const currentScene = scenesConfig.find(s => s.id === currentSceneId);
            const activeColumn = currentScene.polyCol; // Lọc đúng cột dữ liệu Excel của góc hiện tại

            unitData.forEach(item => {
                const unitId = item["Mã căn"] || item.id;
                const rawData = item[activeColumn];

                if (unitId && rawData && rawData.trim() !== "") {
                    try {
                        const parsedData = JSON.parse(rawData);
                        const polygonArray = parsedData.map(p => [p.yaw, p.pitch]);

                        const isSold = item["Trạng thái"] && item["Trạng thái"].toString().toLowerCase().includes("đã bán");
                        const fillColor = isSold ? 'rgba(239, 68, 68, 0.4)' : 'rgba(16, 185, 129, 0.4)';
                        const strokeColor = isSold ? '#ef4444' : '#34d399';

                        markersPlugin.addMarker({
                            id: unitId,
                            polygon: polygonArray,
                            tooltip: { content: `🏠 ${unitId}`, position: 'top center' },
                            svgStyle: { fill: fillColor, stroke: strokeColor, strokeWidth: '2px', cursor: 'pointer' }
                        });
                    } catch (e) {
                        console.warn(`Lỗi hiển thị Polygon căn ${unitId} ở cột ${activeColumn}`);
                    }
                }
            });
        }

        function renderSceneMenu() {
            const menuContainer = document.getElementById('scene-menu');
            scenesConfig.forEach(scene => {
                const btn = document.createElement('button');
                btn.id = `btn-${scene.id}`;
                btn.className = `scene-btn ${scene.id === currentSceneId ? 'active' : ''}`;
                btn.innerText = scene.name;
                btn.onclick = () => switchScene(scene.id);
                menuContainer.appendChild(btn);
            });
        }

        function openPanel(unitId) {
            const data = unitData.find(item => item["Mã căn"] === unitId || item.id === unitId);
            if (!data) return;

            document.getElementById('viewer').style.transform = "translateX(-200px)"; 
            document.getElementById('info-panel').classList.remove('translate-x-full');

            const soldStamp = document.getElementById('sold-stamp');
            if (data["Trạng thái"] && data["Trạng thái"].toString().toLowerCase().includes("đã bán")) {
                soldStamp.classList.remove('hidden');
            } else { soldStamp.classList.add('hidden'); }

            document.getElementById('unit-title').innerText = data["Mã căn"] || data.id || "";
            document.getElementById('unit-zone').innerText = data["Phân khu"] || data.zone || "";

            const detailsContainer = document.getElementById('unit-details');
            let htmlContent = '';
            
            // Loại bỏ các cột không cần hiển thị text (STT, Mã căn, Trạng thái, ảnh và các cột polygon)
            for (const [key, value] of Object.entries(data)) {
                if (['STT', 'Mã căn', 'id', 'Phân khu', 'zone', 'Trạng thái', 'images'].includes(key) || key.startsWith('poly_')) continue;
                if (value === null || value === undefined || value.toString().trim() === "") continue;
                
                htmlContent += `<div class="flex justify-between py-2 border-b border-white/10"><span class="text-white/60 text-sm">${key}</span><span class="font-semibold text-white text-right max-w-[65%] break-words">${value}</span></div>`;
            }

            // Xử lý nạp ảnh mặt bằng & phối cảnh
            let imagesHtml = '';
            if (data["Mẫu nhà"]) {
                const mauNhaCode = data["Mẫu nhà"].toString().trim();
                imagesHtml += `<img src="images/thietkecan/${mauNhaCode}.png" class="w-full rounded-xl mb-4 shadow-lg border border-white/10 bg-white/5" onerror="this.style.display='none'">`;
            }
            if (data.images) {
                let imageArray = typeof data.images === 'string' ? data.images.split(',') : data.images;
                imageArray.forEach(img => { if (img.trim()) imagesHtml += `<img src="images/${img.trim()}" class="w-full rounded-xl mb-4 shadow-lg border border-white/10" onerror="this.style.display='none'">`; });
            }
            
            if (imagesHtml !== '') htmlContent += `<div class="mt-8"><h3 class="text-white/50 font-bold mb-4 uppercase text-xs tracking-widest">Mặt bằng & Phối cảnh</h3>` + imagesHtml + `</div>`;
            detailsContainer.innerHTML = htmlContent;
        }

        function closePanel() {
            document.getElementById('viewer').style.transform = "translateX(0)";
            document.getElementById('info-panel').classList.add('translate-x-full');
        }

        loadDataAndInitViewer();
    </script>
</body>
</html>
