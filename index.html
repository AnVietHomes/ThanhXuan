<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Real Estate Viewer - Photo Sphere Viewer & SVG Polygon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Photo Sphere Viewer CSS & JS từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/svg-overlay-plugin/index.min.css"/>
    
    <script src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/svg-overlay-plugin/index.min.js"></script>

    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-range: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: -8px 0 32px 0 rgba(31, 38, 135, 0.2);
        }
        .transition-transform {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Style cho các ô Polygon vẽ ranh giới căn hộ */
        .custom-polygon {
            fill: rgba(16, 185, 129, 0.3); /* Màu xanh ngọc mờ khi bình thường */
            stroke: #34d399;              /* Viền sáng */
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .custom-polygon:hover {
            fill: rgba(16, 185, 129, 0.7); /* Sáng lên khi rê chuột vào */
            stroke: #ffffff;
            stroke-width: 3px;
        }
    </style>
</head>
<body class="bg-gray-900 overflow-hidden font-sans text-gray-100">

    <div class="relative w-full h-screen flex">
        
        <!-- Khung chứa ảnh 360 Photo Sphere Viewer -->
        <div id="viewer" class="w-full h-full transition-transform transform translate-x-0 relative z-0 bg-black"></div>

        <!-- Công cụ hỗ trợ hướng dẫn trên màn hình -->
        <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-4 py-2 rounded-lg text-xs z-20 text-emerald-300 pointer-events-none">
            💡 Click vào các ô đa giác trên ảnh để xem thông tin chi tiết căn hộ
        </div>

        <!-- Glassmorphism Panel (Bảng thông tin bên phải) -->
        <div id="info-panel" class="glass-panel absolute top-0 right-0 w-[420px] h-full p-6 flex flex-col transform translate-x-full transition-transform z-30">
            
            <!-- Dấu mộc Đã Bán -->
            <img id="sold-stamp" src="images/sold.png" class="hidden absolute top-4 -left-10 w-32 h-32 z-40 drop-shadow-lg transform -rotate-12 pointer-events-none" alt="Đã bán">

            <!-- Nút đóng -->
            <button onclick="closePanel()" class="absolute top-4 right-4 text-white hover:text-gray-300 transition-colors z-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Tiêu đề Căn & Phân khu -->
            <h2 id="unit-title" class="text-3xl font-bold mb-1 mt-6 text-white uppercase tracking-wider drop-shadow-md"></h2>
            <div id="unit-zone" class="text-sm uppercase tracking-widest text-emerald-400 font-bold mb-6"></div>

            <!-- Vùng chứa các dòng thông số -->
            <div id="unit-details" class="flex-1 overflow-y-auto no-scrollbar space-y-4 relative pr-2">
                <!-- Data đổ tự động vào đây -->
            </div>
            
            <!-- Nút liên hệ -->
            <div class="mt-6 pt-4 border-t border-white/20">
                <button class="w-full py-3 bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold rounded-lg border border-emerald-400/50 transition-all shadow-[0_4px_15px_rgba(16,185,129,0.3)]">
                    NHẬN BÁO GIÁ
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ PHOTO SPHERE VIEWER & SVG POLYGON -->
    <script>
        let unitData = [];
        let psv;

        // 1. Đọc file CSV
        function parseCSVRow(str) {
            const result = [];
            let curVal = '';
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === '"') {
                    inQuotes = !inQuotes;
                } else if (str[i] === ',' && !inQuotes) {
                    result.push(curVal.trim());
                    curVal = '';
                } else {
                    curVal += str[i];
                }
            }
            result.push(curVal.trim());
            return result;
        }

        async function loadDataAndInitViewer() {
            try {
                const response = await fetch('data.csv'); 
                let csvText = await response.text();
                csvText = csvText.replace(/\r/g, '');
                const lines = csvText.split('\n');
                
                if (lines.length >= 2) {
                    const headers = parseCSVRow(lines[0]);
                    unitData = [];
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const currentline = parseCSVRow(lines[i]);
                        const obj = {};
                        for (let j = 0; j < headers.length; j++) {
                            obj[headers[j]] = currentline[j] || "";
                        }
                        unitData.push(obj);
                    }
                    console.log("✅ Tải Data CSV thành công");
                }
            } catch (error) {
                console.error("❌ Lỗi tải file data.csv:", error);
            }

            initPhotoSphereViewer();
        }

        // 2. Khởi tạo Photo Sphere Viewer
        function initPhotoSphereViewer() {
            psv = new PhotoSphereViewer.Viewer({
                container: document.querySelector('#viewer'),
                panorama: 'images/panorama.jpg', // Thay đường dẫn ảnh 360 của bạn vào đây
                autorotateSpeed: '2rpm',
                plugins: [
                    PhotoSphereViewer.SvgOverlayPlugin,
                ],
            });

            psv.addEventListener('ready', () => {
                const svgPlugin = psv.getPlugin(PhotoSphereViewer.SvgOverlayPlugin);
                
                // VẼ CÁC POLYGON Ô ĐẤT CĂN HỘ TRÊN ẢNH 360
                // Photo Sphere Viewer sử dụng hệ tọa độ góc (yaw, pitch) hoặc tọa độ vector để tạo đa giác SVG ôm trọn lô đất.
                // Dưới đây là cấu trúc mẫu định nghĩa các điểm nối của đa giác cho từng căn hộ:
                const polygonsData = [
                    {
                        id: "LA01-01",
                        // Mảng các điểm tọa độ (yaw, pitch) tạo thành hình khối bao quanh căn biệt thự
                        // Bạn có thể dễ dàng căn chỉnh các tọa độ này cho khớp với ô đất thực tế
                        points: [
                            { yaw: 0.10, pitch: -0.02 },
                            { yaw: 0.15, pitch: -0.02 },
                            { yaw: 0.15, pitch: -0.06 },
                            { yaw: 0.10, pitch: -0.06 }
                        ]
                    },
                    {
                        id: "LA01-22",
                        points: [
                            { yaw: 0.20, pitch: -0.03 },
                            { yaw: 0.25, pitch: -0.03 },
                            { yaw: 0.25, pitch: -0.07 },
                            { yaw: 0.20, pitch: -0.07 }
                        ]
                    }
                ];

                polygonsData.forEach(item => {
                    // Tạo phần tử polygon SVG
                    const polygon = svgPlugin.createPolygon({
                        id: item.id,
                        points: item.points,
                        svgStyle: {
                            className: 'custom-polygon'
                        },
                        tooltip: `Căn hộ: ${item.id}`
                    });

                    // Lắng nghe sự kiện click vào ô đa giác ranh giới ô đất
                    polygon.addEventListener('click', () => {
                        openPanel(item.id);
                    });
                });
            });
        }

        // 3. Mở Panel hiển thị thông tin căn
        function openPanel(unitId) {
            const data = unitData.find(item => item["Mã căn"] === unitId || item.id === unitId);
            if (!data) return;

            document.getElementById('viewer').style.transform = "translateX(-200px)"; 
            document.getElementById('info-panel').classList.remove('translate-x-full');

            const soldStamp = document.getElementById('sold-stamp');
            if (data["Trạng thái"] && data["Trạng thái"].toString().toLowerCase().includes("đã bán")) {
                soldStamp.classList.remove('hidden');
            } else {
                soldStamp.classList.add('hidden');
            }

            document.getElementById('unit-title').innerText = data["Mã căn"] || data.id || "Đang cập nhật";
            document.getElementById('unit-zone').innerText = data["Phân khu"] || data.zone || "";

            const detailsContainer = document.getElementById('unit-details');
            let htmlContent = '';
            const excludedKeys = ['STT', 'Mã căn', 'id', 'Phân khu', 'zone', 'Trạng thái', 'images'];

            for (const [key, value] of Object.entries(data)) {
                if (excludedKeys.includes(key)) continue;
                if (value === null || value === undefined || value.toString().trim() === "") continue;

                htmlContent += `
                    <div class="flex justify-between items-center py-2 border-b border-white/10">
                        <span class="text-white/60 text-sm">${key}</span>
                        <span class="font-semibold text-white text-right max-w-[65%] break-words">${value}</span>
                    </div>
                `;
            }

            let imagesHtml = '';
            if (data["Mẫu nhà"] && data["Mẫu nhà"].toString().trim() !== "") {
                const mauNhaCode = data["Mẫu nhà"].toString().trim();
                imagesHtml += `<img src="images/thietkecan/${mauNhaCode}.png" class="w-full rounded-xl mb-4 shadow-lg border border-white/10 hover:scale-[1.02] transition-transform bg-white/5" alt="Mặt bằng ${mauNhaCode}" onerror="this.style.display='none'">`;
            }

            if (data.images && data.images.trim() !== "") {
                let imageArray = typeof data.images === 'string' ? data.images.split(',') : data.images;
                imageArray.forEach(img => {
                    const imgName = img.trim();
                    if (imgName) {
                        imagesHtml += `<img src="images/${imgName}" class="w-full rounded-xl mb-4 shadow-lg border border-white/10 hover:scale-[1.02] transition-transform" alt="Phối cảnh" onerror="this.style.display='none'">`;
                    }
                });
            }

            if (imagesHtml !== '') {
                htmlContent += `<div class="mt-8"><h3 class="text-white/50 font-bold mb-4 uppercase text-xs tracking-widest">Mặt bằng & Phối cảnh</h3>` + imagesHtml + `</div>`;
            }

            detailsContainer.innerHTML = htmlContent;
        }

        // 4. Đóng Panel
        function closePanel() {
            document.getElementById('viewer').style.transform = "translateX(0)";
            document.getElementById('info-panel').classList.add('translate-x-full');
        }

        loadDataAndInitViewer();
    </script>
</body>
</html>
